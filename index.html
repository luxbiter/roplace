<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find mesh and texture IDs in public Roblox assets and download original files.">
  <title>roplace</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    :root { font-family: Arial, sans-serif; color: #20242a; background: #f5f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .panel { width: min(100%, 620px); background: #fff; border: 1px solid #dfe3e8; border-radius: 12px; padding: 32px; box-shadow: 0 8px 30px #1b27300a; }
    h1 { font-size: 1.55rem; margin: 0; letter-spacing: -.025em; }
    h2 { font-size: 1.1rem; margin: 0 0 14px; }
    p { line-height: 1.6; margin: 0; }
    .tool { margin-top: 26px; }
    .lower { border-top: 1px solid #e8eaed; padding-top: 25px; }
    form { margin-top: 28px; }
    label { display: block; font-weight: 600; margin-bottom: 9px; }
    .row { display: flex; gap: 10px; }
    input { min-width: 0; flex: 1; border: 1px solid #bfc7d0; border-radius: 7px; padding: 12px 13px; font: inherit; }
    input:focus { outline: 2px solid #3264c8; outline-offset: 1px; }
    button { border: 0; border-radius: 7px; background: #275ac4; color: #fff; font: inherit; font-weight: 600; padding: 12px 18px; cursor: pointer; }
    button:hover { background: #1d49a7; }
    button:disabled { opacity: .65; cursor: wait; }
    .status { min-height: 1.6em; margin-top: 18px; }
    .note { margin-top: 22px; padding-top: 18px; border-top: 1px solid #e8eaed; color: #57616e; font-size: .9rem; }
    .results { display: grid; gap: 12px; border: 1px solid #dfe3e8; border-radius: 7px; padding: 16px; }
    .results div { display: flex; align-items: baseline; flex-wrap: wrap; gap: 9px; }
    .results strong { min-width: 90px; }
    .results code { background: #f0f3f8; padding: 4px 7px; border-radius: 4px; font-size: .95rem; }
    @media(max-width: 460px) { .panel { padding: 24px 20px; } .row { flex-direction: column; } button { width: 100%; } }
  </style>
</head>
<body>
  <main><section class="panel">
    <h1>roplace</h1>
    <section class="tool" aria-labelledby="lookup-heading">
      <h2 id="lookup-heading">Find mesh and texture IDs</h2>
      <form id="lookup-form">
        <label for="market-id">Marketplace asset ID</label>
        <div class="row"><input id="market-id" inputmode="numeric" placeholder="Item asset ID" autocomplete="off" required><button type="submit">Find IDs</button></div>
      </form>
      <p class="status" id="lookup-status" role="status" aria-live="polite"></p>
      <div class="results" id="results" hidden></div>
      <p class="note">Shows IDs found in public model files. Some items may be unavailable.</p>
    </section>
    <section class="tool lower" aria-labelledby="download-heading">
      <h2 id="download-heading">Download original file</h2>
      <p>Enter a mesh or texture ID to download its original file.</p>
      <form id="download-form">
        <label for="asset-id">Asset ID</label>
        <div class="row"><input id="asset-id" inputmode="numeric" placeholder="e.g. 7229442422" autocomplete="off" required><button type="submit">Download</button></div>
      </form>
      <p class="status" id="download-status" role="status" aria-live="polite"></p>
      <p class="note">Public assets only. Meshes are saved in Roblox format.</p>
    </section>
  </section></main>
  <script>
    const API = 'https://roblox-asset-fetcher.si-le.chatgpt.site';
    const valid = id => /^[1-9]\d{0,18}$/.test(id);
    const lookup = document.getElementById('lookup-form');
    const download = document.getElementById('download-form');
    const lookupStatus = document.getElementById('lookup-status');
    const downloadStatus = document.getElementById('download-status');
    const results = document.getElementById('results');
    function row(label, values) {
      const line = document.createElement('div');
      const title = document.createElement('strong'); title.textContent = label; line.append(title);
      if (values.length) for (const id of values) {
        const value = document.createElement('code'); value.textContent = id; line.append(value);
      } else { const value = document.createElement('span'); value.textContent = 'None'; line.append(value); }
      return line;
    }
    lookup.addEventListener('submit', async event => {
      event.preventDefault();
      const id = document.getElementById('market-id').value.trim();
      results.hidden = true; results.replaceChildren();
      if (!valid(id)) { lookupStatus.textContent = 'Enter a numeric Marketplace asset ID.'; return; }
      const button = lookup.querySelector('button'); button.disabled = true; lookupStatus.textContent = 'Looking up IDs…';
      try {
        const response = await fetch(`${API}/api/inspect/${id}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Could not find asset IDs.');
        results.append(row('Mesh IDs', data.meshIds), row('Texture IDs', data.textureIds));
        results.hidden = false; lookupStatus.textContent = '';
      } catch (error) { lookupStatus.textContent = error.message || 'Could not find asset IDs.'; }
      finally { button.disabled = false; }
    });
    download.addEventListener('submit', async event => {
      event.preventDefault();
      const id = document.getElementById('asset-id').value.trim();
      if (!valid(id)) { downloadStatus.textContent = 'Enter a numeric asset ID.'; return; }
      const button = download.querySelector('button'); button.disabled = true; downloadStatus.textContent = 'Fetching file…';
      try {
        const response = await fetch(`${API}/api/asset/${id}`);
        if (!response.ok) { const data = await response.json(); throw new Error(data.error || 'Download failed.'); }
        const blob = await response.blob();
        const ext = response.headers.get('X-Asset-Extension') || 'bin';
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a'); link.href = url; link.download = `${id}.${ext}`;
        document.body.append(link); link.click(); link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
        downloadStatus.textContent = `${id}.${ext} download started.`;
      } catch (error) { downloadStatus.textContent = error.message || 'Download failed.'; }
      finally { button.disabled = false; }
    });
  </script>
</body>
</html>
